name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🔥 Repo kodunu runner'a indirir (source code checkout)
      - name: Checkout code
        uses: actions/checkout@v4

      # ☕ Java 21 ortamını kurar (Gradle build için gerekli JDK)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 🔧 gradlew dosyasına execute (çalıştırma) izni verir
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 🏗️ Projeyi Gradle ile build eder (testleri skip eder)
      # clean: eski buildleri temizler
      # build: projeyi compile eder ve jar üretir
      - name: Build with Gradle
        run: bash gradlew clean build -x test

      # 🔐 Docker Hub'a login olur (image push için gerekli)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🐳 Docker image oluşturur
      # latest = en güncel sürüm
      # github.sha = her commit için unique version
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ci-cd-start:latest .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ci-cd-start:${{ github.sha }} .

      # 📤 Docker image'ları Docker Hub'a gönderir
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ci-cd-start:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/ci-cd-start:${{ github.sha }}