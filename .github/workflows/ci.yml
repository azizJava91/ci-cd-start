name: CI Pipeline

on:
  push:
    tags:
      - "v*.*.*"   # 🔥 sadece version tag gelince çalışır

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 📥 repo kodunu çeker
      - name: Checkout code
        uses: actions/checkout@v4

      # ☕ Java ortamı kurar
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 🔧 gradlew izin
      - name: Grant execute permission
        run: chmod +x gradlew

      # 🏗️ build alır
      - name: Build with Gradle
        run: bash gradlew clean build -x test

      # 🔐 Docker login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🐳 Docker build (SADECE VERSION TAG)
      - name: Build Docker image
        run: |
          VERSION=${GITHUB_REF_NAME}

          docker build -t ${{ secrets.DOCKER_USERNAME }}/ci-cd-start:latest .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ci-cd-start:$VERSION .

      # 📤 push
      - name: Push Docker image
        run: |
          VERSION=${GITHUB_REF_NAME}

          docker push ${{ secrets.DOCKER_USERNAME }}/ci-cd-start:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/ci-cd-start:$VERSION